<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalhes do País</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="CSS/style.css">
</head>
<body>
    <div class="container py-5">
        <button class="btn btn-secondary mb-4" onclick="window.location.href='index.html'">← Voltar</button>

        <div id="loading" class="text-center py-5">
            <div class="spinner-border text-primary" role="status"></div>
            <p class="mt-3 mb-0">Carregando informações do país...</p>
        </div>

        <div id="erro" class="alert alert-danger d-none" role="alert"></div>

        <div id="countryDetails" class="d-none">
            <header class="mb-4 text-center">
                <h1 id="detailTitle" class="display-5 fw-bold"></h1>
                <p id="detailSubtitle" class="lead text-secondary"></p>
            </header>

            <div class="row g-4">
                <div class="col-12 col-lg-5">
                    <div class="card" style="border-radius: 20px; overflow: hidden;">
                        <div class="flag-frame p-3" style="background: linear-gradient(180deg, #eef2ff 0%, #f8fafc 100%); min-height: 280px; display: flex; align-items: center; justify-content: center;">
                            <img id="detailFlag" src="" alt="Bandeira do país" style="max-width: 100%; max-height: 100%; object-fit: cover;">
                        </div>
                        <div class="card-body">
                            <p class="text-muted mb-2">Nome oficial</p>
                            <p id="detailOfficial" class="fw-bold fs-5 mb-0"></p>
                        </div>
                    </div>
                </div>

                <div class="col-12 col-lg-7">
                    <div class="card" style="border-radius: 20px; border: none; box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);">
                        <div class="card-body p-4">
                            <div class="row g-3">
                                <div class="col-6">
                                    <p class="text-muted mb-1">Capital</p>
                                    <p id="detailCapital" class="fw-bold mb-0"></p>
                                </div>
                                <div class="col-6">
                                    <p class="text-muted mb-1">Região</p>
                                    <p id="detailRegion" class="fw-bold mb-0"></p>
                                </div>
                                <div class="col-6">
                                    <p class="text-muted mb-1">Sub-região</p>
                                    <p id="detailSubregion" class="fw-bold mb-0"></p>
                                </div>
                                <div class="col-6">
                                    <p class="text-muted mb-1">População</p>
                                    <p id="detailPopulation" class="fw-bold mb-0"></p>
                                </div>
                                <div class="col-6">
                                    <p class="text-muted mb-1">Área</p>
                                    <p id="detailArea" class="fw-bold mb-0"></p>
                                </div>
                                <div class="col-6">
                                    <p class="text-muted mb-1">Nome nativo</p>
                                    <p id="detailNative" class="fw-bold mb-0"></p>
                                </div>
                            </div>
                            <hr>
                            <div>
                                <p class="text-muted mb-1">Idiomas</p>
                                <p id="detailLanguages" class="fw-bold mb-0"></p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="JS/details.js"></script>
</body>
</html>
